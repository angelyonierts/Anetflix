<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Anetflix</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #fff; background: linear-gradient(120deg, rgba(0,0,0,.92), rgba(20,20,20,.68)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2000&q=85') center/cover; }
    .card { width: min(92vw, 430px); padding: 42px 38px; border-radius: 8px; background: rgba(0,0,0,.78); box-shadow: 0 16px 50px rgba(0,0,0,.45); }
    .brand { margin: 0 0 30px; color: #e50914; font-size: 2.2rem; letter-spacing: -.08em; font-weight: 800; }
    h1 { margin: 0 0 24px; font-size: 1.8rem; }
    label { display: block; margin: 16px 0 7px; color: #ddd; font-size: .9rem; }
    input { width: 100%; padding: 14px; border: 1px solid #555; border-radius: 4px; outline: none; color: #fff; background: #333; font-size: 1rem; }
    input:focus { border-color: #fff; }
    button { width: 100%; margin-top: 26px; padding: 14px; border: 0; border-radius: 4px; color: #fff; background: #e50914; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #f6121d; }
    .message { min-height: 22px; margin: 14px 0 0; font-size: .9rem; }
    .error { color: #ffb3b3; }
    .success { color: #9af0b2; }
    .hint { margin: 22px 0 0; color: #aaa; font-size: .82rem; line-height: 1.45; }
    .logout { display: none; margin-top: 16px; background: #555; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">ANETFLIX</p>
    <section id="login-view">
      <h1>Iniciar sesión</h1>
      <form id="login-form" novalidate>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="nombre@ejemplo.com">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Tu contraseña">
        <button type="submit">Iniciar sesión</button>
      </form>
      <p id="message" class="message" role="alert"></p>
      <p class="hint">Modo provisional para GitHub Pages: la validación se realiza únicamente en este navegador. El backend se conectará más adelante.</p>
    </section>
    <section id="welcome-view" hidden>
      <h1>¡Bienvenido!</h1>
      <p id="welcome-message" class="success"></p>
      <button id="logout" class="logout" type="button">Cerrar sesión</button>
    </section>
  </main>
  <script>
    const sessionKey = 'anetflix-session';
    const loginView = document.getElementById('login-view');
    const welcomeView = document.getElementById('welcome-view');
    const welcomeMessage = document.getElementById('welcome-message');
    const logoutButton = document.getElementById('logout');
    const message = document.getElementById('message');

    function showSession(email) {
      loginView.hidden = true;
      welcomeView.hidden = false;
      logoutButton.style.display = 'block';
      welcomeMessage.textContent = `Sesión iniciada como ${email}.`;
    }

    const savedEmail = localStorage.getItem(sessionKey);
    if (savedEmail) showSession(savedEmail);

    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = 'message';
      const form = event.currentTarget;
      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !form.email.validity.valid) {
        message.textContent = 'Escribe un correo electrónico válido.';
        message.className = 'message error';
        return;
      }
      if (password.length < 6) {
        message.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        message.className = 'message error';
        return;
      }
      localStorage.setItem(sessionKey, email);
      showSession(email);
    });

    logoutButton.addEventListener('click', () => {
      localStorage.removeItem(sessionKey);
      welcomeView.hidden = true;
      loginView.hidden = false;
      document.getElementById('login-form').reset();
      document.getElementById('email').focus();
    });
  </script>
</body>
</html>
